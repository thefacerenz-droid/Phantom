name: Build Phantom iPhone App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test balance logic
        run: |
          swiftc SpectraWallet/Wallet.swift Tests/main.swift -o /tmp/wallet-tests
          /tmp/wallet-tests

      - name: Install project generator
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Phantom iPhone app
        run: |
          xcodebuild -project Phantom.xcodeproj -scheme Phantom \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Phantom unsigned IPA
        run: bash scripts/package-ipa.sh

      - name: Upload Phantom IPA
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-unsigned-iPhone
          path: build/Phantom-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
